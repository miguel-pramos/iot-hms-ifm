# UERANSIM gNB config — anuncia 2 slices (NSSAI) pro AMF/UE
mcc: '999'
mnc: '70'
nci: '0x000000010'
idLength: 32
tac: 1

linkIp: 127.0.0.1
ngapIp: 127.0.0.1
gtpIp: 127.0.0.1

amfConfigs:
  - address: 127.0.0.5
    port: 38412

slices:
  - sst: 1
    sd: 0x000001   # slice sensor (Modbus / hub IFM)
  - sst: 1
    sd: 0x000002   # slice dashboard (Flask / Socket.IO)

ignoreStreamIds: true
